name: "Burner Verified"
description: "Burn your take-home on every push: run it like a candidate in a throwaway Vultr VM full of fake secrets, sign the result, and fail + open an issue if it tries to steal."
author: "Maheswar-Sah00"
branding:
  icon: "shield"
  color: "orange"

inputs:
  burner-url:
    description: "Burner server"
    default: "https://139-84-215-1.sslip.io"
  fail-on:
    description: "Verdicts that fail the check (comma-separated)"
    default: "MALICIOUS,SUSPICIOUS"
  open-issue:
    description: "On a push to a branch, open an issue when the verdict fails the check"
    default: "true"
  comment-on-pr:
    description: "On a pull request, comment the verdict on the PR"
    default: "true"
  timeout-minutes:
    description: "How long to wait for the burn (it queues if Burner is busy)"
    default: "20"
  github-token:
    description: "Token used to comment and open issues"
    default: ${{ github.token }}

outputs:
  verdict:
    description: "MALICIOUS, SUSPICIOUS, NO MALICIOUS BEHAVIOUR OBSERVED or INCONCLUSIVE"
    value: ${{ steps.burn.outputs.verdict }}
  report-url:
    description: "The full Burner report"
    value: ${{ steps.burn.outputs.report-url }}
  verify-url:
    description: "The Burner Verified page for this repo"
    value: ${{ steps.burn.outputs.verify-url }}

runs:
  using: "composite"
  steps:
    - id: burn
      shell: bash
      env:
        BURNER_URL: ${{ inputs.burner-url }}
        FAIL_ON: ${{ inputs.fail-on }}
        OPEN_ISSUE: ${{ inputs.open-issue }}
        COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        TIMEOUT_MIN: ${{ inputs.timeout-minutes }}
        GH_TOKEN: ${{ inputs.github-token }}
        EVENT_NAME: ${{ github.event_name }}
        REPO: ${{ github.repository }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_REF: ${{ github.head_ref }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python3 "${{ github.action_path }}/action/burn.py"
