<!doctype html>
<html><head><meta charset="utf-8"><title>Burner promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#050505;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const EMBER='#ff6a2b',EMBER_D='#e2501a',INK='#ededed',BG='#050505';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eback=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function font(w,s,m){ctx.font=`${w} ${s}px ${m?'"Geist Mono"':'Geist'}`}
function noise(x,y,t){return (Math.sin(x*.013+t*.7)+Math.sin(y*.017-t*.5)+Math.sin((x+y)*.009+t*.3))/3}

// ---------- pre-made grain ----------
const grains=[];for(let g=0;g<6;g++){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const d=x.createImageData(256,256),r=rng(g+9);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);grains.push(c)}

// ---------- particles ----------
const SRC={x:600,y:556}, EX={x:1560,y:132};
const CARDS=[
 ['AWS access key','AKIA4Q7RZ2LX8M3NJ2NX'],
 ['SSH private key','~/.ssh/id_ed25519'],
 ['MetaMask vault','Chrome extension storage'],
 ['Saved passwords','Chrome · Login Data'],
 ['Solana wallet','~/.config/solana/id.json'],
];
const CX=1150,CY0=262,CH=100,CW=600,CG=124;
const P=[];{const r=rng(42);for(let i=0;i<5;i++)for(let k=0;k<46;k++){P.push({i,l:5.0+.3*i+r()*.38,o1:(r()-.5)*420,o2:(r()-.5)*300,sz:1.6+r()*2.6,yj:(r()-.5)*60})}}
function qb(a,c,b,u){const v=1-u;return{x:v*v*a.x+2*v*u*c.x+u*u*b.x,y:v*v*a.y+2*v*u*c.y+u*u*b.y}}
function ppos(p,t){const T1=.52,T2=.6;const s=t-p.l;if(s<0)return null;const card={x:CX+8,y:CY0+p.i*CG+CH/2+p.yj*.4};
 if(s<T1){const u=eio(s/T1);const c={x:(SRC.x+card.x)/2,y:(SRC.y+card.y)/2+p.o1};return qb(SRC,c,card,u)}
 if(s<T1+T2){const u=eio((s-T1)/T2);const c={x:(card.x+EX.x)/2+p.o2*.4,y:(card.y+EX.y)/2+p.o2};return qb(card,c,EX,u)}
 return null}
const hitT=i=>5.0+.3*i+.5;

// ---------- background dot field ----------
function dots(t,glow){const sp=20;for(let y=sp/2;y<H;y+=sp)for(let x=sp/2;x<W;x+=sp){
 const dx=(x-W/2)/W,dy=(y-H/2)/H;let v=.16+.13*noise(x,y,t)-Math.hypot(dx,dy)*.35;
 let e=0;for(const g of glow){const d=Math.hypot(x-g.x,y-g.y);e+=g.a*Math.exp(-(d*d)/(2*g.r*g.r))}
 v+=e;if(v<=.02)continue;const r=Math.min(3.6,1+v*4);
 ctx.fillStyle=e>.12?`rgba(255,106,43,${clamp(.25+e)})`:`rgba(237,237,237,${clamp(.05+v*.5,0,.3)})`;ctx.fillRect(x-r/2,y-r/2,r,r)}}

// ---------- HUD chip (the "MOSQUITO SPECIES" style label) ----------
function chip(x,y,label,value,a,accent){if(a<=0)return;ctx.save();ctx.globalAlpha=a;font(500,22,1);
 const lw=ctx.measureText(label).width;font(600,22,1);const vw=value?ctx.measureText(value).width:0;const w=lw+vw+(value?78:56),h=48;
 rr(x,y,w,h,24);ctx.fillStyle='rgba(18,18,18,.82)';ctx.fill();ctx.strokeStyle=accent?'rgba(255,106,43,.6)':'rgba(255,255,255,.14)';ctx.lineWidth=1.5;ctx.stroke();
 ctx.fillStyle=accent?EMBER:'#7a7a7a';ctx.beginPath();ctx.arc(x+24,y+h/2,5,0,7);ctx.fill();
 font(500,22,1);ctx.fillStyle='#bdbdbd';ctx.textBaseline='middle';ctx.fillText(label,x+40,y+h/2+1);
 if(value){font(600,22,1);ctx.fillStyle=accent?EMBER:INK;ctx.fillText(value,x+52+lw,y+h/2+1)}ctx.restore();return w}

// ---------- scene pieces (world coords) ----------
const MSG=[['Hi! Your GitHub profile stood out. ','Senior Backend role, ','$180–220k','.'],
 ['Please clone our take-home and ','run it before our call tomorrow','.'],
 ['Let\'s continue on ','Telegram','.']];
const FLAGS=[[0,2],[1,1],[2,1]];
function message(t){const a=seg(t,.15,.8)*(1-seg(t,3.25,3.8));if(a<=0)return;const y0=330+(1-eo(seg(t,.15,.9)))*70-eio(seg(t,3.25,3.8))*80;
 ctx.save();ctx.globalAlpha=a;const x=430,w=1060,h=330;rr(x,y0,w,h-30,22);ctx.fillStyle='#0d0d0d';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1.5;ctx.stroke();
 ctx.fillStyle='#262626';ctx.beginPath();ctx.arc(x+58,y0+58,24,0,7);ctx.fill();font(600,22);ctx.fillStyle='#cfcfcf';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('D',x+58,y0+59);ctx.textAlign='left';
 font(600,24);ctx.fillStyle=INK;ctx.fillText('Daniel',x+96,y0+48);font(400,20,1);ctx.fillStyle='#777';ctx.fillText('Talent Partner · Lumina Ledger',x+96,y0+76);
 ctx.fillStyle='#555';ctx.textAlign='right';ctx.fillText('09:41',x+w-36,y0+58);ctx.textAlign='left';
 const total=MSG.reduce((s,l)=>s+l.join('').length,0);let shown=Math.floor(total*seg(t,.9,2.55));font(400,30);ctx.textBaseline='alphabetic';
 MSG.forEach((line,li)=>{let cx=x+40;const ly=y0+150+li*54;line.forEach((part,pi)=>{const n=Math.max(0,Math.min(part.length,shown));shown-=part.length;const s=part.slice(0,n);
  const isFlag=FLAGS.some(f=>f[0]===li&&f[1]===pi);const pw=ctx.measureText(part).width;
  if(isFlag&&n===part.length){const fi=FLAGS.findIndex(f=>f[0]===li&&f[1]===pi);const u=eo(seg(t,2.55+fi*.22,2.85+fi*.22));
   if(u>0){ctx.fillStyle='rgba(255,106,43,.22)';ctx.fillRect(cx-4,ly-30,(pw+8)*u,40);ctx.fillStyle=EMBER;ctx.fillRect(cx-4,ly+8,(pw+8)*u,3)}}
  ctx.fillStyle=isFlag&&seg(t,2.55,2.7)>0&&n===part.length?'#ffd9c7':'#d6d6d6';ctx.fillText(s,cx,ly);cx+=pw})});
 if(seg(t,.9,2.6)<1&&Math.floor(t*3)%2===0){/*caret*/}
 ctx.restore()}

const TERM=[[3.55,'$ git clone lumina-ledger/take-home','#d6d6d6'],[3.95,'$ npm install','#d6d6d6'],[4.2,'  added 214 packages in 6s','#6f6f6f'],[4.45,'$ npm start','#ffffff'],[4.8,'> api listening on :3000','#6f6f6f']];
function terminal(t){const a=seg(t,3.3,3.7)*(1-seg(t,10.6,11.4)*0);if(a<=0)return;const x=170,y=330+(1-eo(seg(t,3.3,3.8)))*40,w=780,h=400;
 ctx.save();ctx.globalAlpha=a;rr(x,y,w,h,18);ctx.fillStyle='#0b0b0b';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1.5;ctx.stroke();
 ['#3a3a3a','#3a3a3a','#3a3a3a'].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+30+i*24,y+30,6,0,7);ctx.fill()});
 font(400,18,1);ctx.fillStyle='#5a5a5a';ctx.fillText('~/take-home — zsh',x+120,y+36);
 font(400,26,1);TERM.forEach(([ts,s,c],i)=>{const u=seg(t,ts,ts+.28);if(u<=0)return;const n=Math.floor(s.length*u);ctx.fillStyle=c;ctx.fillText(s.slice(0,n),x+36,y+104+i*52)});
 // npm start glow
 const g=seg(t,4.6,5.0)*(1-seg(t,7.2,8));if(g>0){ctx.fillStyle=`rgba(255,106,43,${.16*g})`;rr(x+22,y+104+3*52-34,300,46,8);ctx.fill()}
 ctx.restore()}

function cards(t){font(500,20,1);ctx.fillStyle=`rgba(150,150,150,${seg(t,3.6,4)})`;ctx.fillText(seg(t,8.3,8.6)>0?'THE SECRETS ON "YOUR LAPTOP"':'THE SECRETS ON YOUR LAPTOP',CX,CY0-26);
 CARDS.forEach(([lab,val],i)=>{const a=eo(seg(t,3.7+i*.12,4.2+i*.12));if(a<=0)return;const y=CY0+i*CG+(1-a)*30;const hit=seg(t,hitT(i),hitT(i)+.25);
  ctx.save();ctx.globalAlpha=a;rr(CX,y,CW,CH,16);ctx.fillStyle=hit>0?`rgba(40,16,8,${.9})`:'#0e0e0e';ctx.fill();ctx.strokeStyle=hit>0?`rgba(255,106,43,${.35+.5*hit})`:'rgba(255,255,255,.1)';ctx.lineWidth=hit>0?2:1.5;ctx.stroke();
  if(hit>0){ctx.shadowColor=EMBER;ctx.shadowBlur=30*(1-seg(t,hitT(i)+.2,hitT(i)+1));rr(CX,y,CW,CH,16);ctx.stroke();ctx.shadowBlur=0}
  font(600,26);ctx.fillStyle=INK;ctx.fillText(lab,CX+30,y+42);font(400,20,1);ctx.fillStyle=hit>0?'#c98a6c':'#6f6f6f';ctx.fillText(val,CX+30,y+74);
  if(hit>0){const u=eback(seg(t,hitT(i)+.05,hitT(i)+.35));ctx.save();ctx.translate(CX+CW-92,y+50);ctx.scale(u,u);rr(-62,-20,124,40,20);ctx.fillStyle=EMBER;ctx.fill();font(700,18,1);ctx.fillStyle='#140600';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('STOLEN',0,1);ctx.restore()}
  const f=eback(seg(t,8.35+i*.12,8.75+i*.12));if(f>0){ctx.save();ctx.translate(CX+CW-92,y+50);ctx.rotate(-.12);ctx.scale(f,f);rr(-58,-24,116,48,8);ctx.fillStyle='#050505';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.stroke();font(800,24,1);ctx.fillStyle=INK;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('FAKE',0,1);ctx.restore()}
  ctx.restore()})}

function exfil(t){const a=seg(t,5.3,5.6);if(a<=0)return;const fake=seg(t,8.5,8.8);const lab=fake>0?'FAKE INTERNET':'UPLOAD →',val=fake>0?'0 packets out':'203.0.113.55:1224';
 const pulse=.5+.5*Math.sin(t*9);ctx.save();ctx.shadowColor=EMBER;ctx.shadowBlur=fake>0?0:18*pulse*a;chip(EX.x-250,EX.y-24,lab,val,a,true);ctx.restore()}

function swarm(t){ctx.save();ctx.globalCompositeOperation='lighter';for(const p of P){for(let k=0;k<6;k++){const q=ppos(p,t-k*.018);if(!q)continue;const al=(1-k/6)*.85;ctx.fillStyle=k===0?`rgba(255,190,140,${al})`:`rgba(255,106,43,${al*.7})`;const s=p.sz*(1-k/8);ctx.beginPath();ctx.arc(q.x,q.y,s,0,7);ctx.fill()}}ctx.restore()}

// world-space glass box (the throwaway VM)
const BOX={x:90,y:60,w:1740,h:900};
function vmbox(t){const a=seg(t,7.3,8.0);if(a<=0)return;ctx.save();ctx.globalAlpha=a;rr(BOX.x,BOX.y,BOX.w,BOX.h,40);ctx.strokeStyle='rgba(237,237,237,.55)';ctx.lineWidth=4;ctx.stroke();
 const g=ctx.createLinearGradient(0,BOX.y,0,BOX.y+BOX.h);g.addColorStop(0,'rgba(255,255,255,.035)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fill();
 ctx.restore()}

// ---------- logo ----------
const LOGO1=new Path2D('M19.5 5.5H9.5a4 4 0 0 0-4 4v13a4 4 0 0 0 4 4h13a4 4 0 0 0 4-4V12.5'),LOGO2=new Path2D('M16.2 9.6c.5 2.5-.9 3.9-2.2 5.2-1.2 1.2-2.2 2.6-2.2 4.5a4.4 4.4 0 0 0 8.8 0c0-1.8-.8-3-1.7-4 .1 1.2-.4 2.2-1.4 2.6.3-2.6-.3-5.6-1.3-8.3z');
function logo(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s/32,s/32);ctx.strokeStyle=INK;ctx.lineWidth=2.2;ctx.lineCap='square';ctx.stroke(LOGO1);ctx.fillStyle=EMBER;ctx.fill(LOGO2);ctx.fillRect(22.4,6.3,3.4,3.4);ctx.restore()}

// ---------- main render ----------
function camera(t){// returns scale around center + pan
 let s=1+.04*seg(t,0,3.3);s=lerp(s,1,seg(t,3.2,3.8));
 s*=lerp(1,.62,eio(seg(t,7.0,8.3)));return s}
function caption(text,sub,t0,t1,y){const a=seg(t0[0],t0[1],t0[2])*(1-seg(t0[0],t1[0],t1[1]));if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';font(650,64);ctx.fillStyle=INK;ctx.fillText(text,W/2,y+(1-eo(a))*20);if(sub){font(450,30,1);ctx.fillStyle='#8a8a8a';ctx.fillText(sub,W/2,y+56)}ctx.restore()}

function burnMask(t,bx){// dither burn over the VM box in screen space
 const f=eio(seg(t,10.25,11.45));if(f<=0)return;const c=10,x0=Math.floor(bx.x/c)*c,y0=Math.floor(bx.y/c)*c;const front=f*1.45-.2;
 for(let y=y0;y<bx.y+bx.h;y+=c)for(let x=x0;x<bx.x+bx.w;x+=c){const hsh=((Math.sin(x*12.9898+y*78.233)*43758.5453)%1+1)%1;
  const v=(bx.y+bx.h-y)/bx.h+.22*hsh;
  if(v<front-.09){ctx.fillStyle=BG;ctx.fillRect(x,y,c+1,c+1)}else if(v<front){const k=(front-v)/.09;ctx.fillStyle=BG;ctx.fillRect(x,y,c+1,c+1);if(hsh>.25){ctx.fillStyle=`rgb(255,${Math.floor(170-110*k)},${Math.floor(60-30*k)})`;ctx.fillRect(x+1,y+1,c-2,c-2)}}}}

window.renderAt=function(t){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
 const s=camera(t);const end=seg(t,11.4,11.6);
 // glows
 const glow=[];if(t>5)glow.push({x:EX.x,y:EX.y,r:180,a:.25*seg(t,5.3,6)*(1-seg(t,8.4,9))});
 glow.push({x:W/2,y:H*.62,r:420,a:.32*eo(seg(t,13.5,15.5))});
 dots(t,glow);
 // world
 const wa=1-end;if(wa>0){ctx.save();ctx.globalAlpha=wa;ctx.translate(W/2,H/2);ctx.scale(s,s);ctx.translate(-W/2,-H/2);
  message(t);terminal(t);cards(t);swarm(t);exfil(t);vmbox(t);ctx.restore();
  // box label + verdict in screen space
  const bx={x:W/2+(BOX.x-W/2)*s,y:H/2+(BOX.y-H/2)*s,w:BOX.w*s,h:BOX.h*s};
  const la=seg(t,7.6,8.2)*wa;if(la>0){chip(bx.x,bx.y-70,'THROWAWAY VULTR VM ·','gVisor sandbox',la,false);
   const va=eback(seg(t,8.0,8.4));if(va>0){ctx.save();ctx.globalAlpha=wa;ctx.translate(bx.x+bx.w-120,bx.y-46);ctx.scale(va,va);rr(-120,-26,240,52,26);ctx.fillStyle=EMBER;ctx.fill();font(700,24,1);ctx.fillStyle='#140600';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('MALICIOUS',0,1);ctx.restore()}}
  burnMask(t,{x:bx.x-6,y:bx.y-80,w:bx.w+12,h:bx.h+92});
 }
 // HUD (screen)
 chip(70,64,'INCOMING · LINKEDIN DM','',seg(t,.3,.7)*(1-seg(t,3.1,3.5)),false);
 const rf=Math.round(3*seg(t,2.55,3.1));chip(70,64+0*64,'',null,0);
 if(t>2.5&&t<3.6){chip(W-330,64,'RED FLAGS',String(rf),seg(t,2.5,2.7)*(1-seg(t,3.2,3.6)),true)}
 const n=Math.round(10*seg(t,5.5,6.9));chip(70,64,'SECRETS STOLEN',String(n).padStart(2,'0')+' / 18',seg(t,5.4,5.7)*(1-seg(t,7.0,7.5)),true);
 // captions
 caption('Your keys just left the building.','npm start · 10 kinds of secret · port 1224',[t,6.0,6.5],[7.0,7.4],H-110);
 caption('Except it wasn’t your laptop.','Every key was fake. 0 packets got out.',[t,8.7,9.2],[10.0,10.3],H-150);
 // burn stats
 const st=[['VM destroyed after','95 s'],['Vultr API says','404 · gone'],['Whole scan cost','$0.002']];
 st.forEach(([a,b],i)=>{const u=seg(t,11.45+i*.38,11.8+i*.38)*(1-seg(t,13.0,13.4));if(u<=0)return;ctx.save();ctx.globalAlpha=u;ctx.textAlign='center';font(450,30,1);ctx.fillStyle='#8a8a8a';ctx.fillText(a,W/2,H/2-150+i*130);font(650,58,1);ctx.fillStyle=i===1?EMBER:INK;ctx.fillText(b,W/2,H/2-86+i*130+(1-eo(u))*12);ctx.restore()});
 // end card
 const e=seg(t,13.5,14.2);if(e>0){ctx.save();const ls=eback(seg(t,13.5,14.1));ctx.globalAlpha=e;logo(W/2-70*ls,300-70*ls,140*ls);
  ctx.textAlign='center';font(700,96);ctx.fillStyle=INK;ctx.fillText('Burner',W/2,560);
  const e2=seg(t,14.0,14.6);ctx.globalAlpha=e2;font(500,52);ctx.fillStyle='#d9d9d9';ctx.fillText('Run the take-home before it runs you.',W/2,660+(1-eo(e2))*14);
  const e3=seg(t,14.6,15.1);ctx.globalAlpha=e3;font(500,30,1);ctx.fillStyle=EMBER;ctx.fillText('139-84-215-1.sslip.io',W/2,760);
  font(400,24,1);ctx.fillStyle='#6f6f6f';ctx.fillText('Vultr Agent Rush · Track 1: Blast Radius Zero',W/2,808);ctx.restore()}
 // vignette + grain + fade in/out
 const vg=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.globalAlpha=.05;ctx.globalCompositeOperation='overlay';ctx.fillStyle=ctx.createPattern(grains[Math.floor(t*30)%6],'repeat');ctx.fillRect(0,0,W,H);ctx.restore();
 const fi=1-seg(t,0,.35),fo=seg(t,16.4,17);if(fi+fo>0){ctx.fillStyle=`rgba(0,0,0,${Math.max(fi,fo)})`;ctx.fillRect(0,0,W,H)}
};
window.DURATION=17;
Promise.all(['400 30px Geist','500 30px Geist','600 30px Geist','650 30px Geist','700 30px Geist','800 30px Geist','400 30px "Geist Mono"','500 30px "Geist Mono"','600 30px "Geist Mono"','700 30px "Geist Mono"','800 30px "Geist Mono"'].map(f=>document.fonts.load(f))).then(()=>document.fonts.ready).then(()=>{window.READY=true;renderAt(+(location.hash.slice(1)||6.2))});
</script></body></html>
